<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎄 2025 Holiday Gift Exchange 🎁</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --deep-red: #9B1B30;     /* 배경용 딥 레드 */
            --cream-stamp: #F9F7E8;  /* 우표 카드용 크림색 */
            --text-color: #2C2C2C;   /* 텍스트 색상 */
        }

        body {
            font-family: 'Playfair Display', serif;
            background-color: #FFFFFF;
            margin: 0; padding: 0;
            color: var(--text-color);
            min-height: 100vh;
        }

        /* --- [1] 로그인 오버레이 (스탬프 디자인) --- */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #b72525;
            /* 배경에 은은한 종이 질감 추가 */
            display: flex; justify-content: center; align-items: center; z-index: 9999;
        }

        /* 우표 모양의 로그인 박스 컨테이너 */
        .login-box {
            position: relative;
            width: 80%; max-width: 320px;
            /* 전체적인 입체감을 위한 그림자 */
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }

        /* [핵심] 우표 테두리 효과를 만드는 가상 요소 */
        .login-box::before {
            content: '';
            position: absolute;
            /* 콘텐츠 박스보다 약간 크게 설정하여 테두리 영역 확보 */
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            background-color: var(--cream-stamp); /* 카드 색상 */
            
            /* 원형 그라디언트를 사용하여 가장자리에 투명한 구멍 패턴 생성 */
            background-image: radial-gradient(transparent 6px, var(--cream-stamp) 6.5px);
            background-size: 20px 20px; /* 패턴의 크기 (자잘하게) */
            background-position: -10px -10px; /* 패턴 위치 조정 */
            background-repeat: space round; /* 패턴이 잘리지 않고 균일하게 반복되도록 설정 */
            
            z-index: 0; /* 콘텐츠 뒤로 배치 */
        }

        /* 실제 콘텐츠가 들어가는 내부 박스 */
        .login-box-content {
            position: relative;
            background-color: var(--cream-stamp); /* 테두리와 같은 크림색 */
            padding: 50px 30px;
            text-align: center;
            z-index: 1; /* 테두리 위에 배치 */
        }

        /* 내용 스타일 */
        .login-box h2 { 
            font-size: 2.0em; color: var(--deep-red); margin: 0 0 15px 0; 
            letter-spacing: 0.5px; font-weight: 700;
        }
        .login-box p { 
            color: #666; font-style: italic; margin-bottom: 40px; font-size: 1.0em;
        }

        /* 심플한 입력창 (밑줄 스타일) */
        .login-box input { 
            width: 80%; padding: 10px 5px; margin-bottom: 30px; 
            border: none; border-bottom: 1.5px solid #ccc; /* 얇은 회색 밑줄 */
            text-align: center; font-family: inherit; font-size: 1.1em;
            background: transparent; color: var(--text-color); border-radius: 0;
        }
        .login-box input:focus { 
            outline: none; border-bottom-color: var(--deep-red); /* 포커스 시 레드 컬러 */
        }
        
        /* 심플한 라인 버튼 */
        .login-btn { 
            background: transparent; color: var(--deep-red); 
            border: 1px solid var(--deep-red); padding: 10px 30px; 
            cursor: pointer; font-size: 0.9em; font-family: inherit; 
            letter-spacing: 2px; text-transform: uppercase; font-weight: 600;
            transition: all 0.3s;
        }
        .login-btn:hover { 
            background: var(--deep-red); color: var(--cream-stamp); 
        }


        /* --- [2] 헤더 섹션 (기존 유지) --- */
        header { 
            position: relative; width: 100%; height: 70vh; min-height: 500px;
            /* 다운로드 하신 이미지 파일명으로 꼭 수정해주세요! */
            background-image: url('treefinal.jpg'); 
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; overflow: hidden; color: #F2D492;
        }
        header::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.6)); z-index: 1;
        }
        .header-content { position: relative; z-index: 2; width: 100%; max-width: 1000px; }
        h1 { margin: 0; line-height: 0.8; }
        .script-text {
            font-family: 'Playfair Display', serif; font-style: italic; font-size: 5rem; display: block;
            margin-bottom: -15px; font-weight: 400; text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transform: rotate(-5deg);
        }
        .serif-text {
            font-family: 'Playfair Display', serif; font-size: 13vw; display: block;
            font-weight: 700; letter-spacing: -2px; color: #F2D492; text-transform: uppercase;
            text-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .user-controls {
            margin-top: 40px; font-family: 'Playfair Display', serif; letter-spacing: 1px;
            font-size: 1.1rem; display: flex; flex-direction: column; align-items: center;
            gap: 15px; color: rgba(255,255,255,0.9);
        }
        .welcome-msg { font-style: italic; }
        .logout-btn {
            background: transparent; border: 1px solid rgba(242, 212, 146, 0.6); color: #F2D492;
            padding: 8px 20px; border-radius: 30px; cursor: pointer; font-family: inherit;
            font-size: 0.8em; text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s;
        }
        .logout-btn:hover { background: #F2D492; color: #000; box-shadow: 0 0 15px rgba(242, 212, 146, 0.5); }

        /* --- [3] 메인 컨텐츠 (기존 유지) --- */
        .main-section { background-color: #fff; padding: 60px 20px; min-height: 50vh; }
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 40px; max-width: 1200px; margin: 0 auto; }
        .family-card { background: #fff; border: 1px solid #eee; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.03); transition: transform 0.3s; }
        .family-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.08); }
        .card-header { padding: 20px; text-align: center; font-size: 1.3em; font-weight: bold; color: var(--text-color); border-bottom: 1px solid #f4f4f4; letter-spacing: -0.5px; }
        .is-me { border: 1px solid var(--deep-red); }
        .is-me .card-header { color: var(--deep-red); }
        .card-body { padding: 25px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dotted #eee; display: flex; justify-content: space-between; align-items: center; color: #555; font-size: 1.05em; }
        li:last-child { border-bottom: none; }
        .claimed-item { color: #ccc; text-decoration: line-through; }
        .action-btn { background: none; border: none; cursor: pointer; color: #999; transition: color 0.2s;}
        .delete-btn:hover { color: var(--deep-red); }
        .claim-btn { font-size: 0.75em; padding: 6px 12px; border: 1px solid #ddd; background: #fff; color: #666; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: all 0.2s; }
        .claim-btn:hover { border-color: var(--deep-red); color: var(--deep-red); }
        .claim-btn.my-claim { background: var(--deep-red); color: #fff; border-color: var(--deep-red); }
        .claim-btn.claimed { border: none; background: #f9f9f9; color: #ccc; cursor: default; }
        .add-box { margin-top: 10px; display: flex; border-top: 1px solid #f4f4f4; padding-top: 15px; }
        .add-box input { flex: 1; padding: 10px; border: none; background: #f9f9f9; font-family: inherit; margin-right: 5px; }
        .add-box button { background: var(--text-color); color: #fff; border: none; padding: 0 15px; cursor: pointer; }

        @media (max-width: 768px) {
            .script-text { font-size: 3.5rem; }
            .serif-text { font-size: 18vw; }
            header { height: 60vh; min-height: 400px; }
            .container { grid-template-columns: 1fr; gap: 20px;}
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.css"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <div class="login-box-content">
                <h2>Guest List</h2>
                <p>Please enter your name</p>
                <input type="text" id="loginNameInput" placeholder="Name" onkeypress="if(event.keyCode==13) login()">
                <button class="login-btn" onclick="login()">ENTER</button>
            </div>
        </div>
    </div>

    <header>
        <div class="header-content">
            <h1>
                <span class="script-text">Happy</span>
                <span class="serif-text">HOLIDAYS</span>
            </h1>
            <div class="user-controls">
                <span class="welcome-msg" id="userInfoDisplay"></span>
                <button class="logout-btn" onclick="logout()">Change Name</button>
            </div>
        </div>
    </header>

    <div class="main-section">
        <div class="container" id="cardContainer">
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // [중요] Firebase 설정 - 본인의 설정값으로 꼭 채워주세요!
        const firebaseConfig = {
        apiKey: "AIzaSyAhz4dqfFo966SYle88odaVuYwrk_euU7E",
        authDomain: "christmas-wishlist-32ad9.firebaseapp.com",
        projectId: "christmas-wishlist-32ad9",
        storageBucket: "christmas-wishlist-32ad9.firebasestorage.app",
        messagingSenderId: "638733786100",
        appId: "1:638733786100:web:2fb402ab376b7cf59277a1",
        measurementId: "G-603N2QWB04"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const listCollection = collection(db, "familyLists");

        let myName = ""; 

        const savedName = localStorage.getItem("myFamilyName");
        if (savedName) {
            myName = savedName;
            document.getElementById("loginOverlay").style.display = "none";
            updateWelcomeMsg();
            initMyList(); 
        }

        function updateWelcomeMsg() {
            document.getElementById("userInfoDisplay").innerText = `Welcome, ${myName}`;
        }

        window.login = function() {
            const input = document.getElementById("loginNameInput").value.trim();
            if(!input) return alert("이름을 입력해주세요!");
            
            myName = input;
            localStorage.setItem("myFamilyName", myName);
            document.getElementById("loginOverlay").style.display = "none";
            updateWelcomeMsg();
            initMyList();
        }

        window.logout = function() {
            if(confirm("Change Name?")) {
                localStorage.removeItem("myFamilyName");
                location.reload(); 
            }
        }

        async function initMyList() {
            const docRef = doc(db, "familyLists", myName);
            const docSnap = await getDoc(docRef);
            if (!docSnap.exists()) {
                await setDoc(docRef, { items: [] });
            }
        }

        onSnapshot(listCollection, (snapshot) => {
            const container = document.getElementById("cardContainer");
            container.innerHTML = ""; 

            const docs = [];
            snapshot.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));
            docs.sort((a, b) => (a.id === myName ? -1 : b.id === myName ? 1 : 0));

            docs.forEach(userDoc => {
                const isMe = userDoc.id === myName;
                const card = document.createElement("div");
                card.className = `family-card ${isMe ? 'is-me' : ''}`;
                
                let itemsHtml = "";
                const items = userDoc.items || [];

                items.forEach((item, index) => {
                    const isClaimed = item.claimedBy ? true : false;
                    const claimedByMe = item.claimedBy === myName;
                    
                    let actionButton = "";

                    if (isMe) {
                        actionButton = `<button class="action-btn delete-btn" onclick="deleteItem('${userDoc.id}', ${index})"><i class="fas fa-times"></i></button>`;
                    } else {
                        if (!isClaimed) {
                            actionButton = `<button class="claim-btn" onclick="toggleClaim('${userDoc.id}', ${index})">Pick</button>`;
                        } else if (claimedByMe) {
                            actionButton = `<button class="claim-btn my-claim" onclick="toggleClaim('${userDoc.id}', ${index})">Cancel</button>`;
                        } else {
                            actionButton = `<button class="claim-btn claimed">Reserved</button>`;
                        }
                    }

                    const liClass = isClaimed ? "claimed-item" : (isMe ? "my-item" : "");
                    
                    itemsHtml += `
                        <li class="${liClass}" data-index="${index}">
                            <span>${item.text}</span>
                            ${actionButton}
                        </li>
                    `;
                });

                card.innerHTML = `
                    <div class="card-header">
                        ${isMe ? '<i class="fas fa-gift" style="color:#9B1B30; margin-right:5px;"></i>' : ''} 
                        ${userDoc.id}
                    </div>
                    <div class="card-body">
                        <ul id="list-${userDoc.id}">${itemsHtml}</ul>
                        ${isMe ? `
                            <div class="add-box">
                                <input type="text" id="newItemInput" placeholder="Add a wish..." onkeypress="if(event.keyCode==13) addItem()">
                                <button onclick="addItem()"><i class="fas fa-plus"></i></button>
                            </div>
                        ` : ''}
                    </div>
                `;

                container.appendChild(card);

                if (isMe) {
                    const el = card.querySelector(`#list-${userDoc.id}`);
                    new Sortable(el, {
                        animation: 150,
                        onEnd: function (evt) {
                            reorderItems(userDoc.id, evt.oldIndex, evt.newIndex, items);
                        }
                    });
                }
            });
        });

        window.addItem = async function() {
            const input = document.getElementById("newItemInput");
            const text = input.value.trim();
            if (!text) return;

            const docRef = doc(db, "familyLists", myName);
            const docSnap = await getDoc(docRef);
            const currentItems = docSnap.data().items || [];

            currentItems.push({ text: text, claimedBy: null });
            await updateDoc(docRef, { items: currentItems });
            input.value = ""; 
        }

        window.deleteItem = async function(docId, index) {
            if(!confirm("삭제하시겠습니까?")) return;
            const docRef = doc(db, "familyLists", docId);
            const docSnap = await getDoc(docRef);
            const currentItems = docSnap.data().items;
            currentItems.splice(index, 1);
            await updateDoc(docRef, { items: currentItems });
        }

        window.toggleClaim = async function(docId, index) {
            const docRef = doc(db, "familyLists", docId);
            const docSnap = await getDoc(docRef);
            const currentItems = docSnap.data().items;
            const item = currentItems[index];

            if (item.claimedBy === myName) {
                if(confirm("취소하시겠습니까?")) item.claimedBy = null;
                else return;
            } else if (!item.claimedBy) {
                item.claimedBy = myName;
            } else {
                return;
            }
            await updateDoc(docRef, { items: currentItems });
        }

        window.reorderItems = async function(docId, oldIndex, newIndex, currentItems) {
            const [movedItem] = currentItems.splice(oldIndex, 1);
            currentItems.splice(newIndex, 0, movedItem);
            const docRef = doc(db, "familyLists", docId);
            await updateDoc(docRef, { items: currentItems });
        }
    </script>
</body>
</html>
